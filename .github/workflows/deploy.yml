name: Build & Deploy search-user to EC2

on:
  push:
    branches: [qa]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set environment tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "tag=qa-latest" >> $GITHUB_OUTPUT
            echo "env=QA" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "env=PROD" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm run test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        run: |
          IMAGE=kalemat/03-search-user:${{ steps.vars.outputs.tag }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[format('EC2_HOST_{0}', steps.vars.outputs.env)] }}
          username: ${{ secrets[format('EC2_USER_{0}', steps.vars.outputs.env)] }}
          key: ${{ secrets[format('EC2_KEY_{0}', steps.vars.outputs.env)] }}
          script: |
            docker stop 03-search-user || true
            docker rm 03-search-user || true
            docker pull kalemat/03-search-user:${{ steps.vars.outputs.tag }}
            docker run -d --name 03-search-user --restart always -p 3003:3003 kalemat/03-search-user:${{ steps.vars.outputs.tag }}
